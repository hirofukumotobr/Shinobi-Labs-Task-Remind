server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Vite fingerprints these filenames with a content hash, so a changed
    # file always gets a new URL — safe to cache indefinitely.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html (and the PWA manifest) must always be revalidated, otherwise
    # a browser that cached it before a deploy keeps pointing at old /assets/
    # hashes indefinitely and never picks up new code.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
